<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SplitSpell</title>
  <meta name="description" content="Swipe up or down to send drifting letters to the word that needs them. Cozy, fast, no luck involved — every letter always fits exactly one side." />
  <meta name="theme-color" content="#fff8ef" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23fff3e6'/><text x='50' y='42' font-family='Arial,sans-serif' font-weight='900' font-size='30' fill='%234a90a4' text-anchor='middle'>A_</text><text x='50' y='80' font-family='Arial,sans-serif' font-weight='900' font-size='30' fill='%23e88a7d' text-anchor='middle'>_T</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <header id="hud">
      <a id="back" href="../../" title="Back to Voidcade" aria-label="Back to Voidcade">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </a>
      <div class="stat">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
      </div>
      <div id="lives" aria-label="Lives remaining"></div>
      <div class="stat">
        <span class="label">Best</span>
        <span class="value" id="best">0</span>
      </div>
      <button id="mute" title="Sound on/off (M)" aria-label="Toggle sound">
        <svg class="icon-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/>
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/>
          <line x1="16" y1="9" x2="22" y2="15"/>
          <line x1="22" y1="9" x2="16" y2="15"/>
        </svg>
      </button>
    </header>

    <div id="stage">

      <div id="board">

        <div class="wordCard" id="topWordCard">
          <span class="wordLabel">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            swipe up
          </span>
          <span class="wordChars" id="topWord"></span>
        </div>

        <div id="lane">
          <div id="laneTrack">
            <!-- falling letter tokens are injected here by main.js -->
          </div>
        </div>

        <div class="wordCard" id="bottomWordCard">
          <span class="wordChars" id="bottomWord"></span>
          <span class="wordLabel">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>
            swipe down
          </span>
        </div>

      </div>

      <div id="overlay">
        <div class="panel">
          <div class="panelMark">
            <span class="pm-up">A_</span>
            <span class="pm-down">_T</span>
          </div>
          <h1 id="overlay-title">SplitSpell</h1>
          <p id="overlay-sub">Letters drift by. Swipe up or down to send each one to the word that needs it.</p>
          <button id="overlay-btn" class="btn">Play</button>
        </div>
      </div>

    </div>

    <footer id="help">
      <span class="help-desktop">&uarr; / &darr; or <kbd>W</kbd> <kbd>S</kbd>, or click top/bottom half&ensp;&middot;&ensp;<kbd>M</kbd> mute</span>
      <span class="help-mobile">Swipe up or down to catch the letter</span>
    </footer>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
