<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voidburst — Bubble Shooter</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app">
    <div id="canvasHost"></div>

    <!-- Back + mute — same pattern as Stackward / Panes -->
    <div id="topControls">
      <a id="backBtn" href="../../" aria-label="Back to Voidcade" title="Back to Voidcade">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <button id="muteBtn" aria-label="Mute">
        <svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9.5V14.5H7.5L12 18.5V5.5L7.5 9.5H4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M16 9.2C16.9 10 17.5 11 17.5 12C17.5 13 16.9 14 16 14.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M18.3 6.8C19.9 8.2 21 10 21 12C21 14 19.9 15.8 18.3 17.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9.5V14.5H7.5L12 18.5V5.5L7.5 9.5H4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M16.5 9.5L21 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M21 9.5L16.5 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div id="score">0</div>
      <div id="combo" class="hidden">x<span id="comboVal">0</span></div>
      <!-- Roguelite charge meter: fills with popped bubbles, full = powerup pick -->
      <div id="chargeBar" title="Powerup charge">
        <div id="chargeBarFill"></div>
        <span id="chargeBarLabel">POWER</span>
      </div>
      <div id="coinsHud"><span class="coinIcon" data-coin-icon></span><span id="coinsHudVal">0</span></div>
      <div id="activePowerupsHud" class="hidden"></div>
    </div>

    <!-- Active powerup strip (right side) -->

    <!-- Next bubble preview -->
    <div id="nextBubble"><span id="nextBubblePreview"></span></div>

    <!-- Main menu -->
    <div id="menu" class="screen menu-screen">
      <div class="logo-bubbles" aria-hidden="true">
        <span class="lb lb-r"></span>
        <span class="lb lb-g"></span>
        <span class="lb lb-b"></span>
      </div>
      <h1>VOID<span class="accent">BURST</span></h1>

      <button id="playBtn" class="primary-btn">PLAY</button>
      <button id="shopBtn" class="perks-btn">UPGRADES</button>
      <button id="settingsBtn" class="text-btn">SETTINGS</button>

      <div class="menu-footer">
        <span class="footer-stat"><span class="coinIcon" data-coin-icon></span><span id="coinsMenuVal">0</span></span>
        <span class="footer-sep">·</span>
        <span class="footer-stat">Best <b id="bestScoreVal">0</b></span>
      </div>
    </div>

    <!-- Settings -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-panel">
        <h2>Settings</h2>
        <div class="setting-row">
          <span>Music</span>
          <button id="toggleMusic" class="toggle" role="switch" aria-checked="true"><span class="knob"></span></button>
        </div>
        <div class="setting-row">
          <span>Sound Effects</span>
          <button id="toggleSfx" class="toggle" role="switch" aria-checked="true"><span class="knob"></span></button>
        </div>
        <button id="closeSettingsBtn" class="secondary-btn">DONE</button>
      </div>
    </div>

    <!-- Upgrade shop -->
    <div id="shopModal" class="modal hidden">
      <div class="modal-panel shop-panel">
        <div class="shop-header">
          <div class="shop-title">
            <h2>Upgrades</h2>
            <p class="shop-subtitle">Permanent boosts, active every run.</p>
          </div>
          <div class="shop-balance">
            <span class="coinIcon" data-coin-icon></span><span id="shopCoinsVal">0</span>
          </div>
        </div>
        <div id="upgradeList"></div>
        <button id="closeShopBtn" class="secondary-btn">DONE</button>
      </div>
    </div>

    <!-- Roguelite powerup choice (every 10 clears) -->
    <div id="powerupModal" class="modal hidden">
      <div class="modal-panel powerup-panel">
        <span class="powerup-kicker">WAVE <span id="powerupWave">1</span> CLEARED</span>
        <h2>Choose a Powerup</h2>
        <div id="powerupList"></div>
        <button id="rerollBtn" class="text-btn reroll-btn">
          REROLL <span class="coinIcon" data-coin-icon></span><span id="rerollCost">15</span>
        </button>
      </div>
    </div>

    <!-- Game over -->
    <div id="gameover" class="screen hidden">
      <div id="finalScoreWrap">
        <span class="label">Score</span>
        <div id="finalScore">0</div>
      </div>
      <div id="rewardRow">
        <span id="newBestBadge" class="badge hidden">New Best!</span>
        <div class="coinsEarned"><span class="coinIcon" data-coin-icon></span> +<span id="coinsEarnedVal">0</span></div>
      </div>
      <button id="retryBtn" class="primary-btn">RETRY</button>
      <button id="menuBtn" class="secondary-btn">MENU</button>
    </div>

    <!-- Aim hint -->
    <div id="tapHint" class="hidden">TAP ABOVE CANNON TO AIM AND SHOOT</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
