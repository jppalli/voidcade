<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Dominoku: place dominoes so every row and column adds up. A new puzzle set every day." />
    <title>Dominoku</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        var s = JSON.parse(localStorage.getItem('dominoku:state') || '{}');
        var t = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <noscript>Dominoku needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
