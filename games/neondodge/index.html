<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Dodge</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <a class="back-link" href="../../">&larr; Arcade</a>

    <div id="topBanner" class="ad-slot ad-slot-top"></div>

    <div id="hud">
      <div id="score">0</div>
      <div id="bestTag">Best <span id="bestVal">0</span></div>
    </div>

    <div id="menu" class="screen">
      <h1>NEON<span class="accent">DODGE</span></h1>
      <p class="subtitle">Slide between lanes. Survive the shards.</p>
      <button id="playBtn" class="primary-btn">PLAY</button>
      <div class="stats-row">
        <span>Best <b id="menuBestVal">0</b></span>
      </div>
    </div>

    <div id="gameover" class="screen hidden">
      <h1>WIPED OUT</h1>
      <div class="final-score-wrap">
        <span class="label">Score</span>
        <div id="finalScore">0</div>
      </div>
      <span id="newBestBadge" class="badge hidden">New Best!</span>

      <button id="watchAdBtn" class="reward-btn">
        <span class="reward-icon">&#9654;</span> Watch ad &middot; Continue run
      </button>

      <button id="retryBtn" class="primary-btn">RETRY</button>
      <button id="menuBtn" class="secondary-btn">MENU</button>
    </div>

    <div id="tapHint" class="hidden">TAP LEFT / RIGHT OR USE ARROW KEYS</div>

    <div id="bottomBanner" class="ad-slot ad-slot-bottom"></div>
  </div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
